<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const DESTS = {
  hospital: { key: 'hospital', name: '서울대병원',      addr: '종로구 대학로 101',   km: 8.2,  fare: 12400, eta: 14 },
  home:     { key: 'home',     name: '우리집 (자양동)',  addr: '광진구 자양동 415',   km: 4.1,  fare:  7200, eta:  9 },
  senior:   { key: 'senior',   name: '광진 노인복지관',  addr: '광진구 자양로 117',   km: 2.6,  fare:  5400, eta:  6 },
  son:      { key: 'son',      name: '아들 집 (역삼동)', addr: '강남구 역삼동 730',   km: 11.3, fare: 16800, eta: 22 },
};

const PHRASES = [
  { text: '"서울대병원 가자"', dest: 'hospital' },
  { text: '"우리집으로 가요"', dest: 'home'     },
  { text: '"복지관 가자"',     dest: 'senior'   },
  { text: '"아들 집"',         dest: 'son'      },
];

function destFromTranscript(t) {
  if (!t) return null;
  const s = t.toLowerCase();
  if (s.match(/병원|seoul|hospital/)) return DESTS.hospital;
  if (s.match(/우리\s*집|자양|home/))   return DESTS.home;
  if (s.match(/복지|커뮤니티/))         return DESTS.senior;
  if (s.match(/아들|역삼|son/))          return DESTS.son;
  return DESTS.hospital;
}

const STATE_KEY = 'moshyeo-voice-proto/v3';
const loadState = () => { try { return JSON.parse(localStorage.getItem(STATE_KEY)||'null'); } catch { return null; } };
const saveState = (s) => { try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch {} };

function useSpeech(onResult) {
  const ref = useRef(null);
  const SR = typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const supported = !!SR;
  const start = useCallback(() => {
    if (!SR) return false;
    try {
      const r = new SR(); r.lang = 'ko-KR'; r.continuous = false; r.interimResults = false;
      r.onresult = (e) => { const t = e.results[0]?.[0]?.transcript; if (t) onResult(t); };
      r.onerror = () => {}; r.start(); ref.current = r; return true;
    } catch { return false; }
  }, [onResult]);
  const stop = useCallback(() => { try { ref.current?.stop(); } catch {} ref.current = null; }, []);
  return { supported, start, stop };
}

/* ── Waveform ── */
function LiveWaveform() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, height: 120 }}>
      {Array.from({length: 12}).map((_, i) => (
        <div key={i} className="vp-bar" style={{
          width: 10, height: 88, borderRadius: 5,
          background: i % 2 === 0 ? SK.blue : '#69A5FF',
          animationDelay: `${(i * 90) % 1100}ms`,
        }}/>
      ))}
    </div>
  );
}

/* ── Big button ── */

    danger:  { background: SK.red,   color: '#fff' },
    warm:    { background: SK.warm,  color: SK.ink },
  };
  return (
    <div role="button" onClick={onClick} style={{
      cursor: 'pointer', userSelect: 'none',
      ...styles[kind],
      height: 84, borderRadius: 20, display: 'flex',
      alignItems: 'center', justifyContent: 'center', gap: 12,
      fontSize: 26, fontWeight: 800, letterSpacing: '-0.02em', padding: '0 16px',

    }}

    onMouseUp={e => e.currentTarget.style.transform = 'none'}
    onMouseLeave={e => e.currentTarget.style.transform = 'none'}>
      {icon}{children}
    </div>
  );
}

/* ── State machine + root component ── */
function VoiceApp() {
  const initial = loadState() || { step: 'home', destKey: null, transcript: '', secondsLeft: 3, progress: 0 };
  const [s, setS] = useState(initial);
  useEffect(() => saveState(s), [s]);
  const dest = s.destKey ? DESTS[s.destKey] : null;

  useEffect(() => {
    if (s.step !== 'calling') return;
    if (s.secondsLeft <= 0) { setS(v => ({ ...v, step: 'matched' })); return; }
    const t = setTimeout(() => setS(v => ({ ...v, secondsLeft: v.secondsLeft - 1 })), 1000);
    return () => clearTimeout(t);
  }, [s.step, s.secondsLeft]);

  useEffect(() => {
    if (s.step !== 'onride') return;
    if (s.progress >= 1) { setS(v => ({ ...v, step: 'arrived' })); return; }
    const t = setTimeout(() => setS(v => ({ ...v, progress: Math.min(1, v.progress + 1/12) })), 1100);
    return () => clearTimeout(t);
  }, [s.step, s.progress]);

  const speech = useSpeech((t) => {
    const d = destFromTranscript(t);
    if (d) setS(v => ({ ...v, step: 'confirm', destKey: d.key, transcript: t }));
  });

  const actions = {
    startListen: () => { setS(v => ({ ...v, step: 'listening' })); speech.start(); },
    quickPick:   (k) => setS(v => ({ ...v, step: 'confirm', destKey: k, transcript: PHRASES.find(p => p.dest === k).text.replace(/"/g,'') })),
    heard:       (k) => { speech.stop(); setS(v => ({ ...v, step: 'confirm', destKey: k, transcript: PHRASES.find(p => p.dest === k).text.replace(/"/g,'') })); },
    cancel:      () => { speech.stop(); setS(v => ({ ...v, step: 'home' })); },
    retry:       () => setS(v => ({ ...v, step: 'listening' })),
    confirm:     () => setS(v => ({ ...v, step: 'calling', secondsLeft: 3 })),
    boarded:     () => setS(v => ({ ...v, step: 'onride', progress: 0 })),
    done:        () => setS({ step: 'home', destKey: null, transcript: '', secondsLeft: 3, progress: 0 }),
  };

  const etaLeft = dest ? Math.max(1, Math.ceil(dest.eta * (1 - s.progress))) : 0;
  const screen = {
    home:      <ScHome on={actions}/>,
    listening: <ScListening on={actions} speechSupported={speech.supported}/>,
    confirm:   dest && <ScConfirm dest={dest} transcript={s.transcript} on={actions}/>,
    calling:   dest && <ScCalling dest={dest} secondsLeft={s.secondsLeft} on={actions}/>,
    matched:   dest && <ScMatched dest={dest} on={actions}/>,
    onride:    dest && <ScOnRide dest={dest} progress={s.progress} etaLeft={etaLeft} on={actions}/>,
    arrived:   dest && <ScArrived dest={dest} on={actions}/>,
  }[s.step] || <ScHome on={actions}/>;

  const steps = [
    ['home','홈'], ['listening','듣기'], ['confirm','확인'],
    ['calling','호출'], ['matched','매칭'], ['onride','운행'], ['arrived','도착'],
  ];
  const stepIdx = Math.max(0, steps.findIndex(([k]) => k === s.step));

  return (
    <div style={{
      minHeight: '100vh', background: '#0F0F10',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      fontFamily: 'var(--font-primary)', color: '#fff',
    }}>
      {/* Header */}
      <div style={{
        width: '100%', maxWidth: 500, padding: '20px 24px',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16,
        boxSizing: 'border-box',
      }}>
        <div>
          <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.5)', fontWeight: 800, letterSpacing: '0.12em' }}>
            HYPOTHESIS 02 · 인터랙티브 프로토타입
          </div>
          <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: '-0.02em', marginTop: 2 }}>
            모셔다 드림 · 말로 부르기
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
          <div style={{
            padding: '8px 12px', borderRadius: 999, background: 'rgba(255,255,255,0.08)',
            fontSize: 12, fontWeight: 700, color: 'rgba(255,255,255,0.7)',
          }}>
            음성 인식 {speech.supported ? '지원' : '미지원 — 데모 칩'}
          </div>
          <div role="button" onClick={actions.done} style={{
            cursor: 'pointer', padding: '10px 16px', borderRadius: 12,
            border: '1px solid rgba(255,255,255,0.2)', color: '#fff',
            fontSize: 14, fontWeight: 700,
          }}>처음으로</div>
        </div>
      </div>

      {/* Step dots */}
      <div style={{
        display: 'flex', gap: 8, padding: '4px 16px 20px',
        alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center',
      }}>
        {steps.map(([k, label], i) => (
          <React.Fragment key={k}>
            <div style={{
              padding: '6px 12px', borderRadius: 999, fontSize: 13, fontWeight: 700,
              background: i === stepIdx ? '#fff' : 'rgba(255,255,255,0.06)',
              color: i === stepIdx ? SK.ink : i < stepIdx ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.35)',
              border: i === stepIdx ? 'none' : '1px solid rgba(255,255,255,0.08)',
            }}>{i+1}. {label}</div>
            {i < steps.length - 1 && <div style={{ width: 8, height: 1, background: 'rgba(255,255,255,0.18)' }}/>}
          </React.Fragment>
        ))}
      </div>

      {/* Phone frame */}
      <div style={{ padding: '0 16px 40px' }}>
        <AndroidDevice width={412} height={892}>
          <div style={{
            background: '#fff', minHeight: '100%', boxSizing: 'border-box',
            fontFamily: 'var(--font-primary)', color: SK.ink,
            display: 'flex', flexDirection: 'column',
          }}>
            {screen}
          </div>
        </AndroidDevice>
      </div>
    </div>
  );
}
